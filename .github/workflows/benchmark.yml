name: PR Benchmarks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  benchmark_pr:
    name: Compare Test Computation Time (PR vs Main)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_MCA_btl_vader_single_copy_mechanism: none
      IBLGF_MPI_NP: 4
      ALLOWED_SLOWDOWN: "1.05"  # 5% slowdown allowed

    steps:
      - name: Checkout base commit (main side)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout PR head commit (incoming)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image locally
        uses: docker/build-push-action@v5
        with:
          context: base
          file: base/.github/Dockerfile
          push: false
          load: true
          tags: iblgf-bench:base
          build-args: |
            BASE_IMAGE=ubuntu:22.04
            TARGET=cpu
          cache-from: type=gha,scope=bench-base
          cache-to: type=gha,scope=bench-base,mode=max

      - name: Build PR head image locally
        uses: docker/build-push-action@v5
        with:
          context: head
          file: head/.github/Dockerfile
          push: false
          load: true
          tags: iblgf-bench:head
          build-args: |
            BASE_IMAGE=ubuntu:22.04
            TARGET=cpu
          cache-from: type=gha,scope=bench-head
          cache-to: type=gha,scope=bench-head,mode=max

      - name: Benchmark base commit
        run: |
          set -euo pipefail

          docker run --rm \
            -e OMPI_MCA_rmaps_base_oversubscribe=1 \
            --cpuset-cpus="0-3" \
            -v ${{ github.workspace }}/base:/workspace2 \
            -w /workspace2 \
            --user 1001:1001 \
            iblgf-bench:base \
            bash -lc './iblgf.sh run-test ns_amr_lgf configFile_0 --bench -n 4' \
            | tee bench_base_ns.full.txt
          tail -n 1 bench_base_ns.full.txt > bench_base_ns.txt

          docker run --rm \
            -e OMPI_MCA_rmaps_base_oversubscribe=1 \
            --cpuset-cpus="0-3" \
            -v ${{ github.workspace }}/base:/workspace2 \
            -w /workspace2 \
            --user 1001:1001 \
            iblgf-bench:base \
            bash -lc './iblgf.sh run-test poisson config_1_lv_0 --bench -n 4' \
            | tee bench_base_poisson.full.txt
          tail -n 1 bench_base_poisson.full.txt > bench_base_poisson.txt

          echo "Base times:"
          cat bench_base_ns.txt
          cat bench_base_poisson.txt
        env:
          OMPI_MCA_rmaps_base_oversubscribe: 1

      - name: Benchmark PR head commit
        run: |
          set -euo pipefail

          docker run --rm \
            -e OMPI_MCA_rmaps_base_oversubscribe=1 \
            --cpuset-cpus="0-3" \
            -v ${{ github.workspace }}/head:/workspace2 \
            -w /workspace2 \
            --user 1001:1001 \
            iblgf-bench:head \
            bash -lc './iblgf.sh run-test ns_amr_lgf configFile_0 --bench -n 4' \
            | tee bench_head_ns.full.txt
          tail -n 1 bench_head_ns.full.txt > bench_head_ns.txt

          docker run --rm \
            -e OMPI_MCA_rmaps_base_oversubscribe=1 \
            --cpuset-cpus="0-3" \
            -v ${{ github.workspace }}/head:/workspace2 \
            -w /workspace2 \
            --user 1001:1001 \
            iblgf-bench:head \
            bash -lc './iblgf.sh run-test poisson config_1_lv_0 --bench -n 4' \
            | tee bench_head_poisson.full.txt
          tail -n 1 bench_head_poisson.full.txt > bench_head_poisson.txt

          echo "Head times:"
          cat bench_head_ns.txt
          cat bench_head_poisson.txt
        env:
          OMPI_MCA_rmaps_base_oversubscribe: 1

      - name: Compare and enforce slowdown threshold
        run: |
          python3 - << 'PY'
          import os, sys

          allowed = float(os.environ["ALLOWED_SLOWDOWN"])

          def read_float(path):
            s = open(path, "r", encoding="utf-8").read().strip()
            try:
              return float(s)
            except ValueError:
              raise SystemExit(f"Expected a single float in {path}, got:\n{s}")

          cases = [
            ("ns_amr_lgf", "bench_base_ns.txt", "bench_head_ns.txt"),
            ("poisson", "bench_base_poisson.txt", "bench_head_poisson.txt"),
          ]

          failed = False
          print("\n=== PR Benchmark Comparison ===")
          for name, basef, headf in cases:
            base_t = read_float(basef)
            head_t = read_float(headf)
            ratio = head_t / base_t if base_t > 0 else float("inf")
            pct = (ratio - 1.0) * 100.0
            print(f"{name:10s} base={base_t:.3f}s  head={head_t:.3f}s  ratio={ratio:.3f}  ({pct:+.1f}%)")
            if ratio > allowed:
              failed = True

          # Print summary statistics
          print(f"[{name}]")
          print(f"  Original time : {base_t:.3f} s")
          print(f"  New time      : {head_t:.3f} s")
          print(f"  Change        : {(head_t - base_t):+.3f} s ({pct:+.2f}%)")

          print(f"\nAllowed slowdown ratio: {allowed:.3f}")
          if failed:
            print("Benchmark regression detected.")
            sys.exit(1)
          else:
            print("Benchmarks within threshold.")
          PY
