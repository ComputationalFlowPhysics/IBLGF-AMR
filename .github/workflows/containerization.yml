name: Containerization

env:
  IMAGE_SHA: ${{ github.sha }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push-temp:
    name: Build and push temp image (${{ matrix.target }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            arch: amd64
            base_image: "ubuntu:22.04"
            runner: ubuntu-latest
          - target: cpu
            arch: arm64
            base_image: "ubuntu:22.04"
            runner: ubuntu-24.04-arm
          - target: gpu
            arch: amd64
            base_image: "nvidia/cuda:12.1.1-devel-ubuntu22.04"
            runner: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push temporary image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iblgf:tmp-${{ env.IMAGE_SHA }}-${{ matrix.target }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            TARGET=${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }},mode=max

  build-and-test:
    name: Build code + test (${{ matrix.target }}-${{ matrix.arch }})
    needs: build-and-push-temp
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            arch: amd64
            runner: ubuntu-latest
          - target: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: gpu
            arch: amd64
            runner: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build code and run tests inside container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/iblgf:tmp-${{ env.IMAGE_SHA }}-${{ matrix.target }}-${{ matrix.arch }}
          docker run --rm \
            -e OMPI_MCA_rmaps_base_oversubscribe=1 \
            --cpuset-cpus="0-3" \
            -v ${{ github.workspace }}:/workspace2 \
            -w /workspace2 \
            --user 1001:1001 \
            ${{ secrets.DOCKERHUB_USERNAME }}/iblgf:tmp-${{ env.IMAGE_SHA }}-${{ matrix.target }}-${{ matrix.arch }} \
            bash -lc './iblgf.sh test'
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          IBLGF_MPI_NP: 4

  promote-and-manifest:
    name: Promote to stable tags
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote temp images to stable tags and create manifests
        run: |
          REPO=${{ secrets.DOCKERHUB_USERNAME }}/iblgf
          SHA=${{ env.IMAGE_SHA }}

          # CPU: combine amd64 + arm64 into stable manifest
          docker buildx imagetools create \
            -t $REPO:cpu \
            -t $REPO:cpu-$SHA \
            $REPO:tmp-$SHA-cpu-amd64 \
            $REPO:tmp-$SHA-cpu-arm64

          # GPU: amd64 only
          docker buildx imagetools create \
            -t $REPO:gpu \
            -t $REPO:gpu-$SHA \
            $REPO:tmp-$SHA-gpu-amd64

  cleanup:
    name: Delete temporary tags
    needs: [build-and-test, promote-and-manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary tags via API
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          REPO="iblgf"
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

          TAGS=(
            "tmp-${{ env.IMAGE_SHA }}-cpu-amd64"
            "tmp-${{ env.IMAGE_SHA }}-cpu-arm64"
            "tmp-${{ env.IMAGE_SHA }}-gpu-amd64"
          )

          for TAG in "${TAGS[@]}"; do
            echo "Deleting tag: $TAG"
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$USERNAME/$REPO/tags/$TAG/")
            if [ "$RESPONSE" == "204" ]; then
              echo "Deleted $TAG"
            else
              echo "Could not delete $TAG (status $RESPONSE)"
            fi
          done
