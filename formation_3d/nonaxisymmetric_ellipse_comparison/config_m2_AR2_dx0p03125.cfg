// AR2-inspired angular-sector force ratio, NOT an elliptical footprint.
// m=2, epsilon=(AR^2-1)/(AR^2+1); original Fourier forcing, no code changes.
// Based on config3D_nonaxisymmetric.cfg; all unlisted settings are preserved.
// dx halved; domain indices and step count doubled to retain physical bounds/time.
// dt=0.003125; end time=37.5; output interval=0.4; checkpoint interval=1.6.
// block_extent=14 and adapt_frequency=64 retained (adaptation occurs twice as often in time).
// Original initial condition retained: fat_ring=true, no ringType override.
// For a separate initially quiescent experiment, explicitly set ringType=0.
simulation_parameters
{
    nLevels=0;
    Ux=0.0;
    Uy=0.0;
    source_max=1.0;
    nBaseLevelTimeSteps=12000;
    cfl=0.1;
    cfl_max=1000;
    Re=1200.0;
    no_mesh_update=true;
    refinement_factor=0.125;
    R=0.5;
    DistanceOfVortexRings=0.25;
    adapt_frequency=64;
    output_frequency=128;
    base_level_threshold=0.000005;
    hard_max_refinement=true;
    single_ring=true;
    perturbation=false;
    vDelta=0.2;
    Vort_type=0;
    fat_ring=true;
    hdf5_ref_name=null;
    output
    {
        directory=output;
    }
    restart_write_frequency=512;
    write_restart=true;
    use_restart=false;
    restart
    {
        load_directory=restart;
        save_directory=restart;
    }
    domain
    {
        bd_base=(-224,-224, -224);
        bd_extent=(896,448,448);
        dx_base=0.03125;
        block_extent=14;
        block
        {
            base=(-224, -224, -224);
            extent=(448,448,448);
        }
    }
    EXP_LInf=0.001;

    vortex_detection_mode=vorticity_threshold; //q_criterion
    vortex_min_region_area=0.05;
    vortex_identification_threshold_factor=0.02;

    // Azimuthal Fourier modes about x; phases are in radians.
    b_f_m=(2);
    b_f_epsilon_m=(0.6);
    b_f_phi_m=(0.0);

    b_f_mag=1.0;
    b_f_tau=1.0;

    b_f_alpha=1.25643;
    b_f_alpha_r=0.1;
    b_f_alpha_x=0.1;
    b_f_R=0.5;

    calculate_vortex_properties=true;
}
