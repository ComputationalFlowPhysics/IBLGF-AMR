name: Testing

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build + test (${{ matrix.target }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            arch: amd64
            base_image: "ubuntu:22.04"
            runner: ubuntu-latest
          - target: cpu
            arch: arm64
            base_image: "ubuntu:22.04"
            runner: ubuntu-24.04-arm
          - target: gpu
            arch: amd64
            base_image: "nvidia/cuda:12.1.1-devel-ubuntu22.04"
            runner: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PR image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/Dockerfile
          push: false
          load: true
          tags: iblgf-pr:${{ matrix.target }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            TARGET=${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }},mode=max

      - name: Build code and run tests inside PR image
        run: |
          docker run --rm \
            -e OMPI_MCA_rmaps_base_oversubscribe=1 \
            --cpuset-cpus="0-3" \
            -v ${{ github.workspace }}:/workspace2 \
            -w /workspace2 \
            --user 1001:1001 \
            iblgf-pr:${{ matrix.target }}-${{ matrix.arch }} \
            bash -lc './iblgf.sh test'
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_MCA_btl_vader_single_copy_mechanism: none
          OMPI_MCA_rmaps_base_oversubscribe: 1
          IBLGF_MPI_NP: 4

  test-status:
    name: Test Status
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Enforce all matrix jobs passed
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "One or more build/test jobs failed."
            exit 1
          fi
